<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RF Coverage Explorer</title>
    <meta
      name="description"
      content="Interactive RF coverage and KPI maps over USGS 3DEP terrain and NLCD land cover."
    />
  </head>
  <body>
    <div id="app">
      <aside id="panel" aria-label="Controls"></aside>
      <main id="map-wrap">
        <div id="map"></div>
        <div id="legend" aria-label="Legend"></div>
        <section id="profile" aria-label="Path profile" hidden>
          <div id="profile-readout"></div>
          <canvas id="profile-canvas"></canvas>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
